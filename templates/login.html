<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'partials/head.html' %}
</head>
<body>
      <form action="/login" method="POST">
        <div>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div>
            <label for="Password">Password:</label>
            <input 
                type="password"
                id="password"
                name="password"
            >
        </div>

        <div>
            <button type="submit">Log In</button>
        </div>
    </form>

    {% include 'partials/scripts.html' %}
</body>
</html>
